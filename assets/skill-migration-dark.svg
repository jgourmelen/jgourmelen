<svg xmlns="http://www.w3.org/2000/svg" width="784" height="400" viewBox="0 0 784 400" role="img" aria-label="Migration &amp; reprise — Migrer sans perdre de données. Vers Kubernetes, entre clouds, vers le souverain ou après un rachat : près de 180 plateformes clientes migrées sans perte de données. Swarm → Kubernetes, GCP → AWS, Post-acquisition."><title>Migration &amp; reprise — Migrer sans perdre de données. Vers Kubernetes, entre clouds, vers le souverain ou après un rachat : près de 180 plateformes clientes migrées sans perte de données. Swarm → Kubernetes, GCP → AWS, Post-acquisition.</title><style>@font-face{font-family:'sora700';src:url(data:font/woff;base64,) format('woff');}@font-face{font-family:'dm400';src:url(data:font/woff;base64,) format('woff');}@font-face{font-family:'dm500';src:url(data:font/woff;base64,) format('woff');}@font-face{font-family:'dm700';src:url(data:font/woff;base64,) format('woff');}</style><defs><linearGradient id="cg0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#112C3A"/><stop offset="1" stop-color="#0E2531"/></linearGradient></defs><rect x="1" y="1" width="782" height="398" rx="28" fill="url(#cg0)" stroke="#1D4552" stroke-opacity="1" stroke-width="2"/><rect x="44" y="44" width="80" height="80" rx="21" fill="#14918F2E"/><g transform="translate(61.6 61.6) scale(1.8667)"><path fill="none" stroke="#3FC1C9" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="m16 3l4 4l-4 4m4-4H4m4 14l-4-4l4-4m-4 4h16"/></g><text x="146.0" y="78.0" font-family="dm700" font-size="19" fill="#3FC1C9" text-anchor="start" letter-spacing="1.6">MIGRATION &amp; REPRISE</text><text x="146.0" y="118.0" font-family="sora700" font-size="31" fill="#ECF7F7" text-anchor="start">Migrer sans perdre de données</text><text x="44.0" y="182.0" font-family="dm400" font-size="25" fill="#A3C2C5" text-anchor="start">Vers Kubernetes, entre clouds, vers le souverain ou après</text><text x="44.0" y="218.2" font-family="dm400" font-size="25" fill="#